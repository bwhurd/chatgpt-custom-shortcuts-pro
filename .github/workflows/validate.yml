name: Fast validation

on:
  pull_request:
    paths:
      - 'extension/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'biome.json'
      - '.gitignore'
      - '.gitattributes'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'extension/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'biome.json'
      - '.gitignore'
      - '.gitattributes'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Code, settings and fixture regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install and run code and fixture checks
        run: npm run checks -- --ci
      - name: Upload safe check summaries (live page unverified)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shortcut-check-summary
          path: |
            test-results/shortcuts-fast/checks.md
            test-results/shortcuts-fast/live-snapshot.md
          if-no-files-found: warn
          retention-days: 7
